{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-app.fullname" . }}-postgresql
  namespace: {{ .Values.namespaces.database }}
  labels:
    app: {{ include "task-app.name" . }}-database
    chart: {{ include "task-app.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "task-app.name" . }}-database
  template:
    metadata:
      labels:
        app: {{ include "task-app.name" . }}-database
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "task-app.fullname" . }}-database
      containers:
      - name: postgresql
        image: "postgres:15-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgresql

        # Environment variables
        env:
        - name: POSTGRES_DB
          value: "{{ .Values.postgresql.auth.database }}"
        - name: POSTGRES_USER
          value: "{{ .Values.postgresql.auth.username }}"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "task-app.fullname" . }}-db
              key: password

        # Liveness probe
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Resource limits
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"

        # Volume mount
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres

        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

      terminationGracePeriodSeconds: 30

      volumes:
      - name: postgres-storage
        emptyDir: {}
{{- end }}
