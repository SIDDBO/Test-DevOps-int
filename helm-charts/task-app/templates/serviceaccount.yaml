---
# Frontend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-app.fullname" . }}-frontend
  namespace: {{ .Values.namespaces.frontend }}
  labels:
    app: {{ include "task-app.name" . }}-frontend
    chart: {{ include "task-app.chart" . }}
    release: {{ .Release.Name }}

---
# Backend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-app.fullname" . }}-backend
  namespace: {{ .Values.namespaces.backend }}
  labels:
    app: {{ include "task-app.name" . }}-backend
    chart: {{ include "task-app.chart" . }}
    release: {{ .Release.Name }}

---
# Database Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-app.fullname" . }}-database
  namespace: {{ .Values.namespaces.database }}
  labels:
    app: {{ include "task-app.name" . }}-database
    chart: {{ include "task-app.chart" . }}
    release: {{ .Release.Name }}
