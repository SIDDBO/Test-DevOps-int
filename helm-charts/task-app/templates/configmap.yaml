apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-app.fullname" . }}-config
  namespace: {{ .Values.namespaces.backend }}
data:
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  DB_TIMEOUT: {{ .Values.config.DB_TIMEOUT | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-app.fullname" . }}-nginx-config
  namespace: {{ .Values.namespaces.frontend }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://{{ include "task-app.fullname" . }}-backend.{{ .Values.namespaces.backend }}.svc.cluster.local:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://{{ include "task-app.fullname" . }}-backend.{{ .Values.namespaces.backend }}.svc.cluster.local:5000;
        }

        location /metrics {
            proxy_pass http://{{ include "task-app.fullname" . }}-backend.{{ .Values.namespaces.backend }}.svc.cluster.local:5000;
        }
    }

---
# Backend database credentials secret (used by backend deployment)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-app.fullname" . }}-db
  namespace: {{ .Values.namespaces.backend }}
type: Opaque
stringData:
  database: {{ .Values.postgresql.auth.database | quote }}
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}

---
# Database credentials secret (used by PostgreSQL pod in database namespace)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-app.fullname" . }}-db
  namespace: {{ .Values.namespaces.database }}
type: Opaque
stringData:
  database: {{ .Values.postgresql.auth.database | quote }}
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
