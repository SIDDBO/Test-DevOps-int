---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-app.fullname" . }}-backend
  namespace: {{ .Values.namespaces.backend }}
  labels:
    app: {{ include "task-app.name" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ include "task-app.name" . }}-backend

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-app.fullname" . }}-frontend
  namespace: {{ .Values.namespaces.frontend }}
  labels:
    app: {{ include "task-app.name" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: {{ .Values.frontend.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ include "task-app.name" . }}-frontend

---
# PostgreSQL Service (Headless for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-app.fullname" . }}-postgresql
  namespace: {{ .Values.namespaces.database }}
  labels:
    app: {{ include "task-app.name" . }}-database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgresql
  selector:
    app: {{ include "task-app.name" . }}-database
