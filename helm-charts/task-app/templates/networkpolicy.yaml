---
# Frontend Namespace - Deny all (default)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-frontend-deny-all
  namespace: {{ .Values.namespaces.frontend }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Frontend Namespace - Allow ingress and egress to backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-frontend-allow
  namespace: {{ .Values.namespaces.frontend }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "task-app.name" . }}-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.namespaces.backend }}
          podSelector:
            matchLabels:
              app: {{ include "task-app.name" . }}-backend
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

---
# Backend Namespace - Deny all (default)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-backend-deny-all
  namespace: {{ .Values.namespaces.backend }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Backend Namespace - Allow ingress from frontend, egress to database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-backend-allow
  namespace: {{ .Values.namespaces.backend }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "task-app.name" . }}-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.namespaces.frontend }}
          podSelector:
            matchLabels:
              app: {{ include "task-app.name" . }}-frontend
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.namespaces.database }}
          podSelector:
            matchLabels:
              app: {{ include "task-app.name" . }}-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

---
# Database Namespace - Deny all (default)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-database-deny-all
  namespace: {{ .Values.namespaces.database }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Database Namespace - Allow ingress from backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-app.fullname" . }}-database-allow
  namespace: {{ .Values.namespaces.database }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "task-app.name" . }}-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Values.namespaces.backend }}
          podSelector:
            matchLabels:
              app: {{ include "task-app.name" . }}-backend
      ports:
        - protocol: TCP
          port: 5432
