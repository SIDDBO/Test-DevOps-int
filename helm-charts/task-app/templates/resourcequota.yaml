---
# Frontend Namespace ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "task-app.fullname" . }}-frontend-quota
  namespace: {{ .Values.namespaces.frontend }}
spec:
  hard:
    requests.cpu: {{ .Values.resourceQuotas.frontend.cpu }}
    requests.memory: {{ .Values.resourceQuotas.frontend.memory }}
    limits.cpu: {{ .Values.resourceQuotas.frontend.cpu }}
    limits.memory: {{ .Values.resourceQuotas.frontend.memory }}
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values: ["default"]

