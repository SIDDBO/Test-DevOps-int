# Helm Chart Values - Complete Application Configuration
# Segregated into 3 namespaces: frontend, backend, database
# Each namespace has resource quotas, RBAC, and network policies

namespaces:
  frontend: frontend
  backend: backend
  database: database

# Docker registry credentials for pulling private images
# Note: username and password are passed at deploy time via Jenkins, never stored in git
imagePullSecrets:
  - name: docker-hub-secret

dockerRegistry:
  username: ""  # Set via --set dockerRegistry.username=... at deploy time
  password: ""  # Set via --set dockerRegistry.password=... at deploy time

backend:
  name: backend
  replicaCount: 2
  image:
    repository: "docker.io/your-username/task-app-backend"
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  livenessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

frontend:
  name: frontend
  replicaCount: 2
  image:
    repository: "docker.io/your-username/task-app-frontend"
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

postgresql:
  enabled: true
  auth:
    username: "taskapp"
    password: "taskpass123"
    database: "tasks_dev"
  primary:
    persistence:
      size: "1Gi"

autoscaling:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

config:
  LOG_LEVEL: "DEBUG"
  DB_TIMEOUT: "30"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Resource Quotas per namespace
resourceQuotas:
  frontend:
    cpu: "100m"
    memory: "128Mi"
  backend:
    cpu: "200m"
    memory: "256Mi"
  database:
    cpu: "100m"
    memory: "512Mi"
